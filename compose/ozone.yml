x-image: &image
  image: ${OZONE_IMAGE:-apache/ozone}:${OZONE_IMAGE_VERSION:-2.2.0}${OZONE_IMAGE_FLAVOR:-}

x-common-config: &common-config
  OZONE-SITE.XML_hdds.datanode.dir: /data/hdds
  OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata

  # Use stable Docker hostnames instead of ephemeral container IPs
  # for DataNode/Ratis communication.
  OZONE-SITE.XML_hdds.datanode.use.datanode.hostname: "true"

  OZONE-SITE.XML_ozone.om.address: om
  OZONE-SITE.XML_ozone.om.http-address: om:9874
  OZONE-SITE.XML_ozone.recon.address: recon:9891
  OZONE-SITE.XML_ozone.recon.db.dir: /data/metadata/recon
  OZONE-SITE.XML_ozone.scm.block.client.address: scm
  OZONE-SITE.XML_ozone.scm.client.address: scm
  OZONE-SITE.XML_ozone.scm.datanode.id.dir: /data/metadata
  OZONE-SITE.XML_ozone.scm.names: scm
  OZONE-SITE.XML_ozone.s3g.domain.name: s3.ozone
  no_proxy: om,recon,scm,s3g,datanode1,datanode2,datanode3,datanode4,datanode5,kafka,localhost,127.0.0.1

x-datanode: &datanode
  <<: *image
  command: ["ozone", "datanode"]
  environment:
    <<: *common-config
    OZONE_DATANODE_OPTS: "-Xms128m -Xmx320m -XX:ParallelGCThreads=2"
  mem_limit: 576m
  cpus: "0.25"
  depends_on:
    scm:
      condition: service_started
  networks:
    - lakehouse_net
  restart: unless-stopped

services:
  scm:
    <<: *image
    hostname: scm
    ports:
      - "9876:9876"
    environment:
      <<: *common-config
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE_SCM_OPTS: "-Xms128m -Xmx256m -XX:ParallelGCThreads=2"
    mem_limit: 448m
    cpus: "0.30"
    command: ["ozone", "scm"]
    volumes:
      - ozone_scm:/data
    networks:
      - lakehouse_net
    restart: unless-stopped

  om:
    <<: *image
    hostname: om
    ports:
      - "9874:9874"
    environment:
      <<: *common-config
      CORE-SITE.XML_hadoop.proxyuser.hadoop.hosts: "*"
      CORE-SITE.XML_hadoop.proxyuser.hadoop.groups: "*"
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      WAITFOR: scm:9876
      OZONE_OM_OPTS: "-Xms128m -Xmx320m -XX:ParallelGCThreads=2"
    mem_limit: 512m
    cpus: "0.30"
    command: ["ozone", "om"]
    volumes:
      - ozone_om:/data
    depends_on:
      scm:
        condition: service_started
    networks:
      - lakehouse_net
    restart: unless-stopped

  datanode1:
    <<: *datanode
    hostname: datanode1
    environment:
      <<: *common-config
      OZONE-SITE.XML_hdds.datanode.hostname: datanode1
    volumes:
      - ozone_dn1:/data

  datanode2:
    <<: *datanode
    hostname: datanode2
    environment:
      <<: *common-config
      OZONE-SITE.XML_hdds.datanode.hostname: datanode2
    volumes:
      - ozone_dn2:/data

  datanode3:
    <<: *datanode
    hostname: datanode3
    environment:
      <<: *common-config
      OZONE-SITE.XML_hdds.datanode.hostname: datanode3
    volumes:
      - ozone_dn3:/data

  datanode4:
    <<: *datanode
    hostname: datanode4
    environment:
      <<: *common-config
      OZONE-SITE.XML_hdds.datanode.hostname: datanode4
    volumes:
      - ozone_dn4:/data

  datanode5:
    <<: *datanode
    hostname: datanode5
    environment:
      <<: *common-config
      OZONE-SITE.XML_hdds.datanode.hostname: datanode5
    volumes:
      - ozone_dn5:/data

  recon:
    <<: *image
    hostname: recon
    ports:
      - "9888:9888"
    environment:
      <<: *common-config
      OZONE_RECON_OPTS: "-Xms128m -Xmx288m -XX:ParallelGCThreads=2"
    mem_limit: 512m
    cpus: "0.25"
    command: ["ozone", "recon"]
    volumes:
      - ozone_recon:/data
    depends_on:
      scm:
        condition: service_started
      om:
        condition: service_started
    networks:
      - lakehouse_net
    restart: unless-stopped

  s3g:
    <<: *image
    hostname: s3g
    ports:
      - "9878:9878"
    environment:
      <<: *common-config
      WAITFOR: om:9874
      OZONE_S3G_OPTS: "-Xms96m -Xmx224m -XX:ParallelGCThreads=2"
    mem_limit: 384m
    cpus: "0.20"
    command:
      - sh
      - -c
      - |
        set -e
        ozone s3g &
        s3g_pid=$$!

        until ozone sh volume list >/dev/null 2>&1; do
          echo 'Waiting for Ozone Manager...'
          sleep 2
        done

        ozone sh bucket info /s3v/warehouse >/dev/null 2>&1 || \
          ozone sh bucket create -t RATIS -r THREE /s3v/warehouse

        ozone sh bucket set-replication-config \
          -t RATIS \
          -r THREE \
          /s3v/warehouse

        wait "$$s3g_pid"
    healthcheck:
      # Keep this probe lightweight. Starting a second Ozone JVM for every
      # healthcheck takes ~18 seconds when s3g is capped at 0.20 CPU. The
      # start-safe script separately verifies the warehouse bucket via CLI.
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:9878/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      om:
        condition: service_started
    networks:
      lakehouse_net:
        aliases:
          - s3.ozone
          - warehouse.s3.ozone
    restart: unless-stopped

volumes:
  ozone_om:
  ozone_scm:
  ozone_recon:
  ozone_dn1:
  ozone_dn2:
  ozone_dn3:
  ozone_dn4:
  ozone_dn5:

networks:
  lakehouse_net:
